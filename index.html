<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커미션 포트폴리오</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://hangeul.pstatic.net/hangeul_static/css/aggro.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg-color: #ffffff;          
            --border-color: #e2e8f0;      
            --text-color: #1e293b;
            --text-secondary: #64748b;
            --accent-blue-light: #f0f7ff; 
            --accent-blue-border: #bae6fd;
            --window-title-color: #0f172a;
        }

        body { 
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif !important; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 8px 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }
        
        .wrapper {
            width: 100%;
            max-width: 1120px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .retro-window { 
            width: 100%;
            background: #ffffff; 
            border: 1px solid var(--border-color); 
            border-radius: 14px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02); 
            overflow: hidden;
        }
        
        .window-header {
            background: var(--accent-blue-light);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .window-title {
            font-family: 'SBAggroB', 'Pretendard', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--window-title-color);
            letter-spacing: -0.5px;
        }

        .window-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .win-btn {
            width: 9px;
            height: 9px;
            background: #cbd5e1;
            border-radius: 50%;
        }

        .window-body {
            padding: 12px;
            display: grid;
            grid-template-columns: 260px 1fr; /* PC 기본 레이아웃 */
            gap: 12px;
            background: #ffffff;
            align-items: start; 
        }

        /* 💡 PC 레이아웃 고정 높이 */
        .left-panel {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            height: 330px;
            overflow: hidden;
        }

        .right-panel {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            height: 330px;
        }

        /* 💡 모바일 화면(768px 이하)에서만 세로형태로 변경되도록 분기 */
        @media (max-width: 768px) {
            body { padding: 4px; align-items: flex-start; }
            .window-body { 
                grid-template-columns: 1fr; 
                gap: 8px;
                padding: 10px;
            }
            .left-panel {
                height: 200px !important;
            }
            .right-panel {
                height: 340px !important;
            }
            .dual-media-preview {
                grid-template-columns: 1fr !important; /* 모바일은 미디어 위아래 배치 */
            }
        }

        .tab-menu-wrapper {
            position: sticky;
            top: 0;
            background: #ffffff;
            padding: 10px 10px 6px 10px;
            z-index: 20;
            border-bottom: 1px solid #f1f5f9;
        }

        .tab-menu { 
            display: flex; 
            gap: 6px; 
        }

        .tab-btn { 
            flex: 1;
            padding: 6px 4px; 
            border-radius: 7px; 
            border: 1px solid var(--border-color); 
            background: #ffffff; 
            font-family: 'SBAggroB', 'Pretendard', sans-serif;
            font-size: 11px; 
            font-weight: 700;
            cursor: pointer; 
            color: var(--text-secondary); 
            text-align: center;
        }
        .tab-btn:hover, .tab-btn.active { 
            background: var(--accent-blue-light); 
            color: var(--window-title-color); 
            border-color: var(--accent-blue-border);
            box-shadow: 0 2px 6px rgba(186, 230, 253, 0.3);
        }

        .file-list-scroll {
            padding: 6px 10px 10px 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }

        .file-list-scroll::-webkit-scrollbar { width: 4px; }
        .file-list-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 7px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .file-item:hover, .file-item.active { 
            background: var(--accent-blue-light); 
            border-color: var(--accent-blue-border); 
        }
        
        .file-item img {
            width: 28px;
            height: 28px;
            object-fit: cover;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .file-info {
            font-family: 'SBAggroB', 'Pretendard', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-color);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
            line-height: 1.3;
        }
        .file-info span {
            display: block;
            font-family: 'Pretendard', sans-serif;
            font-size: 9px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-top: 1px;
        }

        .detail-display-area { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            width: 100%;
            height: 100%;
        }

        .section-label {
            font-family: 'SBAggroB', 'Pretendard', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: var(--window-title-color);
            background: var(--accent-blue-light);
            border: 1px solid var(--border-color);
            border-radius: 7px;
            padding: 6px 12px;
            flex-shrink: 0;
            text-align: center;
        }

        .unified-viewer-box {
            background: #ffffff;
            border: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .dual-media-preview {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr; /* PC에서는 좌우 나란히 배치 */
            gap: 8px;
            min-height: 0;
        }

        .dual-item {
            background: #ffffff; 
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            height: 100%;
            min-height: 0;
        }

        .dual-item img, .dual-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
        }

        .image-modal {
            display: none;
            position: absolute;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .image-modal.active { display: flex; }
        .modal-content-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            max-width: 95%;
            max-height: 95%;
        }
        .modal-image, .modal-video {
            max-width: 100%;
            max-height: 280px;
            object-fit: contain;
            border-radius: 8px;
        }
        .modal-close-btn {
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="retro-window">
        <div class="window-header">
            <div class="window-title">포트폴리오</div>
            <div class="window-controls">
                <div class="win-btn"></div>
                <div class="win-btn"></div>
                <div class="win-btn"></div>

        </div>

        <div class="window-body">
            <div class="left-panel">
                <div class="tab-menu-wrapper">
                    <div class="tab-menu">
                        <button class="tab-btn active" onclick="filterCategory('all', this)">전체</button>

                <div class="file-list-scroll" id="fileListContainer">

                    <div class="file-item" data-category="female" onclick="updateView('송워량님', this)">
                        <img data-badge="Chzzk" alt="썸">
                        <div class="file-info">송워량님 <span>VSF</span></div>
                    </div>
                    <div class="file-item" data-category="female" onclick="updateView('챠코야님', this)">
                        <img data-badge="Chzzk" alt="썸">
                        <div class="file-info">챠코야님 <span>VSF</span></div>
                    </div>
                    <div class="file-item" data-category="female" onclick="updateView('요*님', this)">
                        <img data-badge="Chzzk" alt="썸">
                        <div class="file-info">요*님 <span>VSF</span></div>
                    </div>
                    <div class="file-item" data-category="female" onclick="updateView('단망찌님', this)">
                        <img data-badge="Chzzk" alt="썸">

                    <div class="file-item" data-category="male" onclick="updateView('루르님', this)">
                        <img data-badge="Chzzk" alt="썸">
                        <div class="file-info">루르님 <span>VSF</span></div>
                    </div>
                    <div class="file-item" data-category="male" onclick="updateView('태호님', this)">
                        <img data-badge="Chzzk" alt="썸">
                        <div class="file-info">태호님 <span>VSF</span></div>
                    </div>
                    <div class="file-item" data-category="male" onclick="updateView('테*님', this)">
                        <img data-badge="Chzzk" alt="썸">

                    <div class="file-item" data-category="male" onclick="updateView('하***님', this)">
                        <img data-badge="Chzzk" alt="썸">

                    </div>
                    <div class="file-item" data-category="male" onclick="updateView('르*님', this)">
                        <img data-badge="Chzzk" alt="썸">
                        <div class="file-info">르*님 <span>Warudo</span></div>
                    </div>
                    <div class="file-item" data-category="male" onclick="updateView('만*님', this)">
                        <img data-badge="Chzzk" alt="썸">
                        <div class="file-info">만*님 <span>Warudo</span></div>
                    </div>
                    <div class="file-item" data-category="male" onclick="updateView('쿠*님', this)">
                        <img data-badge="Chzzk" alt="썸">
                        <div class="file-info">쿠*님 <span>VSF</span></div>
                    </div>
                    <div class="file-item" data-category="male" onclick="updateView('이누형님', this)">
                        <img data-badge="Chzzk" alt="썸">
                        <div class="file-info">이누형님 <span>VSF</span></div>
                    </div>
                    <div class="file-item" data-category="male" onclick="updateView('위**님', this)">
                        <img data-badge="SOOP" alt="썸">

                        <img data-badge="Chzzk" alt="썸">
                        <div class="file-info">해*님 <span>VSF</span></div>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="detail-display-area">
                    <div class="section-label" id="detailTitle">선택된 항목</div>
                    <div class="unified-viewer-box">
                        <div class="media-preview" id="mediaViewer" style="height:100%;">
                            선택된 항목의 상세 영역입니다.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="image-modal" id="imageModal" onclick="closeModal()">
        <div class="modal-content-wrapper" onclick="event.stopPropagation()">
            <button class="modal-close-btn" onclick="closeModal()">✕</button>
            <div id="modalMediaContainer" style="display:flex; justify-content:center; align-items:center;"></div>
        </div>
    </div>
</div>

<script>
    window.setTextBadge = function(imgElement, text) {
        const bgColor = text === 'SOOP' ? '%23e0f2fe' : '%23ecfdf5';
        const textColor = text === 'SOOP' ? '%230284c7' : '%23059669';
        imgElement.src = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><rect width='100%' height='100%' rx='6' fill='${bgColor}'/><text x='50%' y='50%' font-size='8' font-weight='800' dominant-baseline='middle' text-anchor='middle' fill='${textColor}' font-family='sans-serif'>${text}</text></svg>`;
    };

    function sortFileList() {
        const container = document.getElementById('fileListContainer');
        const items = Array.from(container.getElementsByClassName('file-item'));

        items.sort((a, b) => {
            const nameA = a.querySelector('.file-info').firstChild.textContent.trim();
            const nameB = b.querySelector('.file-info').firstChild.textContent.trim();
            return nameA.localeCompare(nameB, 'ko');
        });

        items.forEach(item => container.appendChild(item));
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll('.file-item img').forEach(img => {
            const badgeType = img.getAttribute('data-badge');
            if (badgeType) {
                setTextBadge(img, badgeType);
            }
        });

        sortFileList();

        const firstVisibleItem = document.querySelector('.file-item');
        if (firstVisibleItem) {
            firstVisibleItem.click();
        }
    });

    function filterCategory(category, btnElement) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        const items = document.querySelectorAll('.file-item');
        
        items.forEach(item => {
            const itemCat = item.getAttribute('data-category');
            if (category === 'all' || itemCat === category) {
                item.style.display = 'flex';
            } else {
                item.style.display = 'none';
            }
        });

        if (category === 'all') {
            sortFileList();
        }

        const firstVisible = Array.from(items).find(item => item.style.display !== 'none');
        if (firstVisible) {
            firstVisible.click();
        }
    }

    function openModal(mediaSrc, type) {
        const modal = document.getElementById('imageModal');
        const container = document.getElementById('modalMediaContainer');
        
        if (type === 'img') {
            container.innerHTML = `<img src="${mediaSrc}" class="modal-image" alt="확대 이미지">`;
        } else if (type === 'video') {
            container.innerHTML = `<video src="${mediaSrc}" class="modal-video" autoplay controls loop playsinline></video>`;
        }
        
        modal.classList.add('active');
    }

    function closeModal() {
        const modal = document.getElementById('imageModal');
        const container = document.getElementById('modalMediaContainer');
        modal.classList.remove('active');
        container.innerHTML = '';
    }

    function updateView(title, element) {
